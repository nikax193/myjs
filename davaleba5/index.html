<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>სტუმრების წიგნი</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .submit-btn { background: #2563eb; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        
        .comment-box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 5px; background: #f9f9f9; }
        .comment-box h3 { margin: 0 0 10px 0; color: #333; font-size: 18px; }
        .delete-btn { background: #dc2626; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;}
    </style>
</head>
<body>

    <h2>დატოვეთ კომენტარი</h2>
    
    <form id="commentForm">
        <div class="form-group">
            <label for="authorName">თქვენი სახელი:</label>
            <input type="text" id="authorName" placeholder="მაგ. გიორგი">
        </div>
        <div class="form-group">
            <label for="messageText">შეტყობინება:</label>
            <textarea id="messageText" rows="3" placeholder="დაწერეთ რამე..."></textarea>
        </div>
        <button type="submit" class="submit-btn">დამატება</button>
    </form>

    <hr style="margin: 30px 0;">

    <h3>კომენტარები:</h3>
    <div id="commentsContainer">
        <!-- აქ გამოჩნდება ახალი კომენტარები -->
    </div>

    <script>
        // 1. მოძებნეთ ფორმა და კონტეინერი
        // const form = ...
        // const container = ...
        const form = document.getElementById('commentForm');
        const container = document.getElementById('commentsContainer');

        // 2. ფორმის submit მოვლენის დამუშავება
        // form.addEventListener('submit', (e) => {
            // 3. გააჩერეთ გვერდის რეფრეში

            form.addEventListener('submit', (e) => { e.preventDefault
            
            // 4. მიიღეთ მნიშვნელობები ინფუთებიდან
            const nameInput = document.getElementById('authorName');
            const messageInput = document.getElementById('messageText');
            const nameValue = nameInput.value.trim();
            const messageValue = messageInput.value.trim();

            // 5. შეამოწმეთ ცარიელია თუ არა ველები (ვალიდაცია)
            if (nameValue === '' || messageValue === '') {
                alert('გთხოვთ, შეავსოთ ორივე ველი!');
                return;
            }
            
            // 6. შექმენით ახალი ელემენტები (div, h3, p, button)
            // მიანიჭეთ მათ შესაბამისი კლასები და ტექსტები
            const commentBox = document.createElement('div');
            commentBox.className = 'comment-box';

            const authorHeader = document.createElement('h3');
            authorHeader.textContent = nameValue;

            const messagePara = document.createElement('p');
            messagePara.textContent = messageValue;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'წაშლა';
            
            // 7. ღილაკზე დაადეთ წაშლის (remove) ლოგიკა
            deleteBtn.addEventListener('click', () => {
            commentBox.remove();
            });
            
            // 8. ააწყვეთ ელემენტი (append-ით ჩასვით div-ში)
            // და ჩასვით კონტეინერში

            commentBox.appendChild(authorHeader);
            commentBox.appendChild(messagePara);
            commentBox.appendChild(deleteBtn);
            
            // 9. გაასუფთავეთ ინფუთები
            nameInput.value = '';
            messageInput.value = '';
        });
    </script>
</body>
</html>
